[package]
name = "rjsrt_desktop"
version = "2.7.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides librjsrt shared library for laufey desktop apps"

[lib]
name = "rjsrt"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["v8"]
quickjs = ["deno_core/quickjs", "rjsrt/quickjs", "v8/quickjs"]
v8 = ["deno_core/v8", "rjsrt/v8", "v8/v8"]

[build-dependencies]
deno_runtime.workspace = true
deno_core.workspace = true
v8.workspace = true

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_lib.workspace = true
deno_runtime.workspace = true
deno_snapshots.workspace = true
deno_terminal.workspace = true
rjsrt = { path = "../rt", default-features = false }
laufey = "0.7.0"
libsui.workspace = true

log = { workspace = true, features = ["serde"] }
raw-window-handle.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
