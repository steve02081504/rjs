serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-normalization.workspace = true
urlpattern.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
approx = "0.5.1"
deno_webidl.workspace = true
